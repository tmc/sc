[build-system]
requires = ["setuptools>=64", "wheel", "grpcio-tools>=1.50.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statecharts"
version = "0.1.0"
description = "Python SDK for the Statecharts library - a language-neutral implementation of Harel statecharts"
authors = [
    {name = "Travis Cline", email = "travis.cline@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
keywords = ["statecharts", "state machines", "finite state machines", "harel", "hierarchical", "orthogonal"]
dependencies = [
    "grpcio>=1.50.0",
    "protobuf>=4.21.0",
    "typing-extensions>=4.0.0; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "grpcio-tools>=1.50.0",
]
web = [
    "flask>=2.0.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
]
django = [
    "django>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/tmc/sc"
Repository = "https://github.com/tmc/sc"
Documentation = "https://github.com/tmc/sc/tree/main/docs"
"Bug Tracker" = "https://github.com/tmc/sc/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["statecharts*"]

[tool.setuptools.package-data]
"statecharts.generated" = ["*.py"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-warnings"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]