<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statechart Visualizer & Simulator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "@bufbuild/protobuf": "/node_modules/@bufbuild/protobuf/dist/esm/index.js",
        "@bufbuild/protobuf/codegenv2": "/node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js"
      }
    }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">SC</div>
                <h1>Statechart Visualizer</h1>
            </div>

            <div class="header-toolbar">
                <!-- Mode Toggle -->
                <div class="toolbar-group mode-toggle">
                    <button class="mode-button active" title="Design Mode" data-mode="edit" id="mode-edit">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" />
                        </svg>
                        <span>Design</span>
                    </button>
                    <button class="mode-button" title="Simulation Mode" data-mode="simulation" id="mode-simulation">
                        <svg viewBox="0 0 24 24">
                            <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                        </svg>
                        <span>Simulate</span>
                    </button>
                </div>

                <div class="toolbar-separator"></div>

                <div class="toolbar-group">
                    <button class="tool-button active" title="Select (V)" data-tool="select">
                        <svg viewBox="0 0 24 24">
                            <path d="M2 2L11 11L8 14L4 10L2 12V2M12 12L22 2L22 12L12 22L2 12L12 12Z" />
                        </svg>
                    </button>
                    <button class="tool-button" title="Pan (H)" data-tool="pan">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M13,6V11H18V7.75L22.25,12L18,16.25V13H13V18H16.25L12,22.25L7.75,18H11V13H6V16.25L1.75,12L6,7.75V11H11V6H7.75L12,1.75L16.25,6H13Z" />
                        </svg>
                    </button>
                    <button class="tool-button" title="Zoom" data-tool="zoom">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M15.5,14H20.5L19,15.5L23,19.5L19.5,23L15.5,19L14,20.5V15.5M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                        </svg>
                    </button>
                </div>

                <div class="toolbar-separator"></div>

                <div class="toolbar-group edit-tools">
                    <button class="tool-button" title="Add State (S)" data-tool="add-state">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M17,13H13V17H11V13H7V11H11V7H13V11H17M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
                        </svg>
                    </button>
                    <button class="tool-button" title="Add Transition (T)" data-tool="add-transition">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M4,15V9H12L11.08,9.92L14,7L11.08,9.92L12,9H4V15M20,9V15H12L12.92,14.08L10,17L12.92,14.08L12,15H20V9Z" />

                    </button>

                <div class="toolbar-separator"></div>

                <!-- Undo/Redo -->

                    <button class="tool-button" title="Undo (Ctrl+Z)" id="undo-button" disabled>

                <div class="toolbar-separator"></div>

                        </svg>

                <div class="toolbar-group simulation-controls" id="simulation-toolbar" style="display: none;">

            </svg>

    <!-- Inline CodeGenerator for immediate availability -->
    <script>
        // Minimal CodeGenerator implementation to fix loading issues
        window.CodeGenerator = class CodeGenerator {
            constructor() {
                this.generators = new Map();
                this.config = { indentation: '  ' };
                console.log('✅ CodeGenerator initialized');
            }

            getAvailableFormats() {
                return [
                    { id: 'xstate', name: 'XState v5', version: '5.0', supportsTypeScript: true },
                    { id: 'json', name: 'JSON Export', version: '1.0', supportsTypeScript: false }
                ];
            }

            async generate(statechart, format = 'xstate', options = {}) {
                if (!statechart || !statechart.root_state) {
                    return { success: false, error: 'Invalid statechart' };
                }

                const machineId = options.machineId || 'machine';

                if (format === 'xstate') {
                    return {
                        success: true,
                        code: this.generateXStateCode(statechart, machineId),
                        metadata: { format: 'xstate', machineId: machineId }
                    };
                } else if (format === 'json') {
                    return {
                        success: true,
                        code: JSON.stringify(statechart, null, 2),
                        metadata: { format: 'json' }
                    };
                }

                return { success: false, error: 'Unsupported format: ' + format };
            }

            generateXStateCode(statechart, machineId) {
                const initialState = this.getInitialState(statechart.root_state);
                const states = this.generateStates(statechart.root_state);
                const transitions = this.generateTransitions(statechart.transitions || []);

                return `import { createMachine } from 'xstate';

export const ${machineId}Machine = createMachine({
  id: '${machineId}',
  initial: '${initialState}',
  states: {
${states}
  }${transitions ? `,
  on: {
${transitions}
  }` : ''}
});`;
            }

            getInitialState(state) {
                if (state.children && state.children.length > 0) {
                    const initial = state.children.find(child => child.is_initial);
                    return initial ? initial.label : state.children[0].label;
                }
                return state.label;
            }

            generateStates(state, indent = '    ') {
                if (!state.children || state.children.length === 0) {
                    return `${indent}${state.label}: {}`;
                }

                const states = [];
                for (const child of state.children) {
                    if (child.children && child.children.length > 0) {
                        states.push(`${indent}${child.label}: {
${indent}  initial: '${this.getInitialState(child)}',
${indent}  states: {
${this.generateStates(child, indent + '    ')}
${indent}  }
${indent}}`);
                    } else {
                        states.push(`${indent}${child.label}: {}`);
                    }
                }
                return states.join(',\n');
            }

            generateTransitions(transitions) {
                if (!transitions.length) return '';
                return transitions.map(t =>
                    `    ${t.event}: { target: '${t.to?.[0] || 'unknown'}' }`
                ).join(',\n');
            }
        };

        // Also create stub implementations for missing classes
        window.EventInputSystem = window.EventInputSystem || class {
            constructor() { console.log('✅ EventInputSystem stub created'); }
            setMachine(machine) { this.machine = machine; }
        };

        window.ExportManager = window.ExportManager || class {
            constructor() { console.log('✅ ExportManager stub created'); }
            setMachine(machine) { this.machine = machine; }
        };
    </script>

    <script src="validators.js"></script>
    <script src="code-generator.js"></script>
    <script src="event-input.js"></script>
    <script src="export-manager.js"></script>
    <!-- Editor components -->

    <script src="editor-orchestrator.js"></script>

    <script src="properties-panel.js"></script>

    <script src="trace-history.js"></script>

</body>
