<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statechart Visualizer & Simulator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">SC</div>
                <h1>Statechart Visualizer</h1>
            </div>
            
            <div class="header-toolbar">
                <div class="toolbar-group">
                    <button class="tool-button active" title="Select" data-tool="select">
                        <svg viewBox="0 0 24 24">
                            <path d="M2 2L11 11L8 14L4 10L2 12V2M12 12L22 2L22 12L12 22L2 12L12 12Z"/>
                        </svg>
                    </button>
                    <button class="tool-button" title="Pan" data-tool="pan">
                        <svg viewBox="0 0 24 24">
                            <path d="M13,6V11H18V7.75L22.25,12L18,16.25V13H13V18H16.25L12,22.25L7.75,18H11V13H6V16.25L1.75,12L6,7.75V11H11V6H7.75L12,1.75L16.25,6H13Z"/>
                        </svg>
                    </button>
                    <button class="tool-button" title="Zoom" data-tool="zoom">
                        <svg viewBox="0 0 24 24">
                            <path d="M15.5,14H20.5L19,15.5L23,19.5L19.5,23L15.5,19L14,20.5V15.5M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                        </svg>
                    </button>
                </div>
                
                <div class="toolbar-separator"></div>
                
                <div class="toolbar-group">
                    <button class="tool-button" title="Add State" data-tool="add-state">
                        <svg viewBox="0 0 24 24">
                            <path d="M17,13H13V17H11V13H7V11H11V7H13V11H17M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
                        </svg>
                    </button>
                    <button class="tool-button" title="Add Transition" data-tool="add-transition">
                        <svg viewBox="0 0 24 24">
                            <path d="M4,15V9H12L11.08,9.92L14,7L11.08,9.92L12,9H4V15M20,9V15H12L12.92,14.08L10,17L12.92,14.08L12,15H20V9Z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="controls">
                <select id="example-select">
                    <option value="">Select an example...</option>
                </select>
                <button id="load-example" class="primary">Load Example</button>
                <button id="reset-machine">Reset</button>
            </div>
        </header>

        <main class="main-content">
            <!-- Left Panel - Navigation/Machine List -->
            <div class="panel panel-left">
                <div class="resize-handle left"></div>
                <div class="panel-header">
                    <h2 class="panel-title">Machines</h2>
                    <div class="panel-actions">
                        <button class="panel-action" title="Refresh">
                            <svg viewBox="0 0 24 24">
                                <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/>
                            </svg>
                        </button>
                        <button class="panel-action" title="Add Machine">
                            <svg viewBox="0 0 24 24">
                                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="panel-section">
                        <div class="section-header">
                            <h3 class="section-title">Examples</h3>
                            <button class="section-toggle">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="section-content">
                            <div id="machine-list">
                                <p class="placeholder">No machines available</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel - Main Visualization -->
            <div class="panel panel-center">
                <div class="resize-handle right"></div>
                <div class="panel-header">
                    <h2 class="panel-title">Statechart Visualization</h2>
                    <div class="panel-actions">
                        <button class="panel-action" title="Fit to Screen">
                            <svg viewBox="0 0 24 24">
                                <path d="M9,3V5H5V9H3V5A2,2 0 0,1 5,3H9M15,3H19A2,2 0 0,1 21,5V9H19V5H15V3M19,19V15H21V19A2,2 0 0,1 19,21H15V19H19M5,19H9V21H5A2,2 0 0,1 3,19V15H5V19Z"/>
                            </svg>
                        </button>
                        <button class="panel-action" title="Export">
                            <svg viewBox="0 0 24 24">
                                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="panel-content" style="padding: 0;">
                    <div id="statechart-container">
                        <div class="visualization-overlay">
                            <div class="zoom-controls">
                                <button class="zoom-button" title="Zoom In">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M15.5,14H20.5L19,15.5L23,19.5L19.5,23L15.5,19L14,20.5V15.5M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                                    </svg>
                                </button>
                                <button class="zoom-button" title="Zoom Out">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M15.5,14H20.5L19,15.5L23,19.5L19.5,23L15.5,19L14,20.5V15.5M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                                    </svg>
                                </button>
                                <button class="zoom-button" title="Reset Zoom">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M7,13H17V11H7"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="minimap"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Properties/Details -->
            <div class="panel panel-right">
                <div class="panel-header">
                    <h2 class="panel-title">Properties</h2>
                    <div class="panel-actions">
                        <button class="panel-action" title="Clear All">
                            <svg viewBox="0 0 24 24">
                                <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="panel-section">
                        <div class="section-header">
                            <h3 class="section-title">Current Configuration</h3>
                            <button class="section-toggle">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="section-content">
                            <div id="current-states">
                                <p class="placeholder">No machine loaded</p>
                            </div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <div class="section-header">
                            <h3 class="section-title">Event Controls</h3>
                            <button class="section-toggle">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="section-content">
                            <div id="event-controls">
                                <input type="text" id="event-input" placeholder="Enter event name..." />
                                <button id="send-event">Send Event</button>
                            </div>
                            <div id="available-events">
                                <h4>Available Events:</h4>
                                <div id="event-buttons"></div>
                            </div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <div class="section-header">
                            <h3 class="section-title">Simulation History</h3>
                            <button class="section-toggle">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="section-content">
                            <div id="history-container">
                                <div id="step-history"></div>
                            </div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <div class="section-header">
                            <h3 class="section-title">Machine Context</h3>
                            <button class="section-toggle">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="section-content">
                            <div id="context-display">
                                <pre id="context-json">{}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="status-bar" class="status-bar">
            <div class="status-left">
                <div class="status-item" id="connection-status" class="disconnected">
                    <div class="status-indicator"></div>
                    <span class="status-text">Disconnected</span>
                </div>
                <div class="status-item">
                    <span class="status-text" id="machine-info">No machine loaded</span>
                </div>
            </div>
            <div class="status-right">
                <div class="status-item">
                    <span class="status-text">Statechart Visualizer v1.0</span>
                </div>
            </div>
        </div>

        <!-- Theme Toggle Button (optional) -->
        <button class="theme-toggle" title="Toggle Theme" style="display: none;">
            <svg viewBox="0 0 24 24">
                <path d="M7.5,2C5.71,3.15 4.5,5.18 4.5,7.5C4.5,9.82 5.71,11.85 7.53,13C4.46,13 2,10.54 2,7.5A5.5,5.5 0 0,1 7.5,2M19.07,3.5L20.5,4.93L4.93,20.5L3.5,19.07L19.07,3.5M12.89,5.93L11.41,5L9.97,6L10.39,4.3L9,3.24L10.75,3.12L11.33,1.47L12,3.1L13.73,3.13L12.38,4.26L12.89,5.93M9.59,9.54L8.43,8.81L7.31,9.59L7.65,8.27L6.56,7.44L7.92,7.35L8.37,6.06L8.88,7.33L10.24,7.36L9.19,8.23L9.59,9.54M19,13.5A5.5,5.5 0 0,1 13.5,19C12.28,19 11.15,18.6 10.24,17.93L17.93,10.24C18.6,11.15 19,12.28 19,13.5Z"/>
            </svg>
        </button>
    </div>

    <script src="validators.js"></script>
    <script src="code-generator.js"></script>
    <script src="event-input.js"></script>
    <script type="module" src="visualizer.js"></script>
</body>
</html>
