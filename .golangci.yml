# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - vendor
    - gen
    - .github
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true

linters:
  enable:
    # Enabled by default
    - errcheck    # Checking for unchecked errors
    - gosimple    # Linter for Go source code that specializes in simplifying a code
    - govet       # Vet examines Go source code and reports suspicious constructs
    - ineffassign # Detects when assignments to existing variables are not used
    - staticcheck # Staticcheck is a go vet on steroids, applying a ton of static analysis checks
    - typecheck   # Like the front-end of a Go compiler, parses and type-checks Go code
    - unused      # Checks Go code for unused constants, variables, functions and types

    # Additional linters
    - asciicheck       # Simple linter to check that your code does not contain non-ASCII identifiers
    - bidichk          # Checks for dangerous unicode character sequences
    - bodyclose        # Checks whether HTTP response body is closed successfully
    - contextcheck     # Check the function whether use a non-inherited context
    - cyclop           # Checks function and package cyclomatic complexity
    - dupl             # Tool for code clone detection
    - durationcheck    # Check for two durations multiplied together
    - errname          # Checks that sentinel errors are prefixed with the Err and error types are suffixed with the Error
    - errorlint        # Errorlint is a linter for that can be used to find code that will cause problems with the error wrapping scheme introduced in Go 1.13
    - exhaustive       # Check exhaustiveness of enum switch statements
    - exportloopref    # Checks for pointers to enclosing loop variables
    - forbidigo        # Forbids identifiers
    - funlen           # Tool for detection of long functions
    - gochecknoglobals # Check that no global variables exist
    - gochecknoinits   # Checks that no init functions are present in Go code
    - gocognit         # Computes and checks the cognitive complexity of functions
    - goconst          # Finds repeated strings that could be replaced by a constant
    - gocritic         # Provides diagnostics that check for bugs, performance and style issues
    - gocyclo          # Computes and checks the cyclomatic complexity of functions
    - godot            # Check if comments end in a period
    - gofmt            # Gofmt checks whether code was gofmt-ed
    - gofumpt          # Gofumpt checks whether code was gofumpt-ed
    - goheader         # Checks is file header matches to pattern
    - goimports        # In addition to fixing imports, goimports also formats your code in the same style as gofmt
    - gomnd            # An analyzer to detect magic numbers
    - gomoddirectives  # Manage the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - gomodguard       # Allow and block list linter for direct Go module dependencies
    - goprintffuncname # Checks that printf-like functions are named with f at the end
    - gosec            # Inspects source code for security problems
    - grouper          # An analyzer to analyze expression groups
    - importas         # Enforces consistent import aliases
    - lll              # Reports long lines
    - makezero         # Finds slice declarations with non-zero initial length
    - misspell         # Finds commonly misspelled English words in comments
    - nakedret         # Finds naked returns in functions greater than a specified function length
    - nestif           # Reports deeply nested if statements
    - nilerr           # Finds the code that returns nil even if it checks that the error is not nil
    - nilnil           # Checks that there is no simultaneous return of nil error and an invalid value
    - noctx            # Noctx finds sending http request without context.Context
    - nolintlint       # Reports ill-formed or insufficient nolint directives
    - predeclared      # Find code that shadows one of Go's predeclared identifiers
    - promlinter       # Check Prometheus metrics naming via promlint
    - revive           # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck     # Checks whether Err of rows is checked successfully
    - sqlclosecheck    # Checks that sql.Rows and sql.Stmt are closed
    - tagliatelle      # Checks the struct tags
    - tenv             # Tenv is analyzer that detects using os.Setenv instead of t.Setenv since Go1.17
    - testpackage      # Linter that makes you use a separate _test package
    - tparallel        # Tparallel detects inappropriate usage of t.Parallel() method in your Go test codes
    - unconvert        # Remove unnecessary type conversions
    - unparam          # Reports unused function parameters
    - wastedassign     # Wastedassign finds wasted assignment statements
    - whitespace       # Tool for detection of leading and trailing whitespace

  disable:
    - exhaustivestruct # Disabled: too noisy for struct literals
    - forcetypeassert  # Disabled: type assertions should be handled case by case
    - gci              # Disabled: conflicts with goimports
    - godox            # Disabled: allows TODO/FIXME comments
    - goerr113         # Disabled: too strict for wrapped errors
    - ireturn          # Disabled: interfaces should be returned when appropriate
    - nlreturn         # Disabled: blank lines before return not always needed
    - paralleltest     # Disabled: parallel tests should be decided case by case
    - varnamelen       # Disabled: short variable names are often appropriate
    - wrapcheck        # Disabled: error wrapping should be decided case by case
    - wsl              # Disabled: too opinionated about whitespace

linters-settings:
  cyclop:
    max-complexity: 15
    package-average: 0.0
    skip-tests: true

  dupl:
    threshold: 100

  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - io/ioutil.ReadFile
      - io.Copy(*bytes.Buffer)
      - io.Copy(os.Stdout)

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  exhaustive:
    check-generated: false
    default-signifies-exhaustive: false

  forbidigo:
    forbid:
      - ^print.*$
      - 'fmt\.Print.*'
    exclude_godoc_examples: false

  funlen:
    lines: 100
    statements: 50

  gocognit:
    min-complexity: 15

  goconst:
    min-len: 2
    min-occurrences: 2

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint

  gocyclo:
    min-complexity: 15

  godot:
    scope: declarations
    exclude:
      - "^fixme:"
      - "^todo:"
    period: true
    capital: false

  gofumpt:
    extra-rules: true

  goheader:
    values:
      const:
        COMPANY: Statecharts Project
    template: |-
      Copyright (c) {{ YEAR-RANGE }} {{ COMPANY }}
      SPDX-License-Identifier: MIT

  goimports:
    local-prefixes: github.com/tmc/sc

  gomnd:
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
    ignored-functions:
      - strings.SplitN

  govet:
    check-shadowing: true
    settings:
      printf:
        funcs:
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf

  grouper:
    const-require-single-const: true
    const-require-grouping: true

  importas:
    no-unaliased: true
    alias:
      - pkg: github.com/tmc/sc/gen/statecharts/v1
        alias: pb
      - pkg: github.com/tmc/sc/gen/validation/v1
        alias: vpb

  lll:
    line-length: 120

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  nestif:
    min-complexity: 4

  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

  predeclared:
    ignore: ""
    q: false

  revive:
    min-confidence: 0
    rules:
      - name: atomic
      - name: line-length-limit
        severity: error
        arguments: [120]
      - name: argument-limit
        severity: error
        arguments: [8]
      - name: cyclomatic
        severity: error
        arguments: [15]
      - name: max-public-structs
        severity: error
        arguments: [5]
      - name: file-header
        severity: error
        arguments:
          - This is the text that must appear at the top of source files.

  staticcheck:
    checks: ["all"]

  tagliatelle:
    case:
      rules:
        json: snake
        yaml: snake
        xml: camel
        bson: camel
        avro: snake
        mapstructure: kebab

  testpackage:
    skip-regexp: (export|internal)_test\.go

  unparam:
    check-exported: false

  unused:
    check-exported: false

  whitespace:
    multi-if: false
    multi-func: false

issues:
  exclude-use-default: false
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - goconst
        - gocognit
        - scopelint
        - lll

    # Exclude known linter issues
    - text: "weak cryptographic primitive"
      linters:
        - gosec

    - text: "Use of weak random number generator"
      linters:
        - gosec

    # Exclude shadow checking on err variables
    - text: 'shadow: declaration of "(err|ctx)"'
      linters:
        - govet

    # Exclude lll issues for long lines with go:generate
    - source: "^//go:generate "
      linters:
        - lll

    # Exclude godot for incomplete sentences in examples
    - path: examples/
      text: "Comment should end in a period"
      linters:
        - godot

  exclude:
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print.*|os\.(Un)?Setenv). is not checked

    # govet: Common false positives
    - (possible misuse of unsafe.Pointer|should have signature)

    # staticcheck: Developers tend to write in C-style with an explicit 'break' in a 'switch', so it's ok to ignore
    - ineffective break statement. Did you mean to break out of the outer loop

    # gosec: Too many false-positives on 'unsafe' usage
    - (G103|G601)

    # gosec: These only make sense when paired with a tool like gosec
    - (G104|G307)

  max-issues-per-linter: 50
  max-same-issues: 3

severity:
  default-severity: error
  case-sensitive: false
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - gocritic
      severity: info
    - linters:
        - lll
      severity: warning