version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/tmc/sc
    except:
      - buf.build/googleapis/googleapis
plugins:
  - name: go
    out: ../gen
    opt: paths=source_relative
  - name: go-grpc
    out: ../gen
    opt: paths=source_relative
  - name: apidocs
    out: ../docs
    opt: paths=source_relative
  - name: prost
    out: ../sdks/rust/src/generated
    opt:
      - bytes=.
      - compile_well_known_types
      - file_descriptor_set
  - name: tonic
    out: ../sdks/rust/src/generated
    opt:
      - compile_well_known_types
  - name: python
    out: ../sdks/python/statecharts/generated
  - name: pyi
    out: ../sdks/python/statecharts/generated
