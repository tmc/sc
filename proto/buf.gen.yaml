version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: ../gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../gen
    opt: paths=source_relative
  - local: protoc-gen-apidocs
    out: ../docs
    opt: paths=source_relative
#   - local: protoc-gen-prost
#     out: ../sdks/rust/src/generated
#     opt:
#       - bytes=.
#       - compile_well_known_types
#       - file_descriptor_set
#   - local: protoc-gen-tonic
#     out: ../sdks/rust/src/generated
#     opt:
#       - compile_well_known_types
#   - local: protoc-gen-python
#     out: ../sdks/python/statecharts/generated
#   - local: protoc-gen-pyi
#     out: ../sdks/python/statecharts/generated
  - local: ../cmd/web-visualizer/web/node_modules/.bin/protoc-gen-es
    out: ../cmd/web-visualizer/web/gen
    opt: target=js+dts,import_extension=js
  - remote: buf.build/apple/swift
    out: ../ios/States/States/Generated
    opt: Visibility=Public
