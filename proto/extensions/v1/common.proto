syntax = "proto3";

package extensions.v1;

option go_package = "github.com/tmc/sc/gen/extensions/v1;extensionspb";

import "google/protobuf/timestamp.proto";

// ===========================================================================
// COMMON EXTENSION TYPES
//
// Shared types used across multiple extension protos.
// Centralized here to avoid duplication and ensure consistency.
// ===========================================================================

/**
 * Author provides attribution information.
 *
 * IDENTITY:
 * At minimum, provide name OR email. For automated tools, name may be
 * the tool name (e.g., "zelda3-extractor").
 */
message Author {
  // Display name.
  string name = 1;

  // Email address.
  string email = 2;

  // Organization or team.
  string organization = 3;

  // Unique identifier (ORCID, GitHub username, etc.).
  string identifier = 4;

  // Role in this context: "author", "reviewer", "approver".
  string role = 5;
}

/**
 * License captures licensing information.
 *
 * SPDX COMPLIANCE:
 * Use SPDX identifiers for standard licenses:
 *   - "MIT", "Apache-2.0", "GPL-3.0-only"
 *   - "NOASSERTION" for unknown
 *   - "LicenseRef-<idstring>" for custom licenses
 *
 * REFERENCES:
 * [SPDX] https://spdx.org/licenses/
 */
message License {
  // SPDX license identifier.
  string spdx_id = 1;

  // Full license name.
  string name = 2;

  // License URL.
  string url = 3;

  // Copyright holder.
  string copyright = 4;

  // Copyright year(s).
  string year = 5;

  // Additional notices or terms.
  string notice = 6;

  // Whether license was detected vs declared.
  bool detected = 7;
}

/**
 * Link provides an external reference.
 *
 * LINK TYPES:
 * Common types for categorization:
 *   - "documentation": User/developer docs
 *   - "design": Design documents, RFCs
 *   - "issue": Bug tracker, feature request
 *   - "figma": Figma design link
 *   - "confluence": Confluence wiki
 *   - "api": API documentation
 *   - "source": Source code reference
 */
message Link {
  // Link title for display.
  string title = 1;

  // URL (must be valid URI).
  string url = 2;

  // Link type for categorization.
  string type = 3;

  // Brief description of what the link contains.
  string description = 4;
}

/**
 * ChangeEntry records a modification to an element.
 */
message ChangeEntry {
  // Version when change was made.
  string version = 1;

  // Timestamp of change.
  google.protobuf.Timestamp timestamp = 2;

  // Author of the change.
  Author author = 3;

  // Type of change: "created", "modified", "reviewed", "approved".
  string change_type = 4;

  // Description of the change.
  string description = 5;

  // Issue/ticket reference.
  string ticket = 6;
}
