# Production Docker Compose configuration
version: '3.8'

services:
  web-visualizer:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: alpine
    image: statechart/web-visualizer:latest
    container_name: statechart-web-prod
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
    networks:
      - statechart-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  python-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: python-prod
    image: statechart/python-api:latest
    container_name: statechart-api-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://statechart:statechart@postgres:5432/statechart
      - REDIS_URL=redis://redis:6379
    networks:
      - statechart-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: statechart-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-statechart}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-statechart}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --auth=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - statechart-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statechart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: statechart-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - statechart-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: statechart-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - statechart-net
    depends_on:
      - web-visualizer
      - python-api

networks:
  statechart-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local