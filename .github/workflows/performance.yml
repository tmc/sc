name: Performance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily
  workflow_dispatch:

jobs:
  # Benchmark tests
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.1'
      
      - name: Generate code
        run: make generate
      
      - name: Run Go benchmarks
        run: |
          go test -run=^$ -bench=. -benchmem -count=5 -timeout=30m ./... | tee go-benchmark.txt
      
      - name: Run memory profiling
        run: |
          go test -run=TestLargeStatechart -memprofile=mem.prof ./semantics/v1/profiling/
          go tool pprof -text mem.prof > memory-profile.txt
      
      - name: Run CPU profiling
        run: |
          go test -run=TestLargeStatechart -cpuprofile=cpu.prof ./semantics/v1/profiling/
          go tool pprof -text cpu.prof > cpu-profile.txt
      
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmarks
          tool: 'go'
          output-file-path: go-benchmark.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: 'benchmarks/go'
      
      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: performance-profiles
          path: |
            *.prof
            *-profile.txt
          retention-days: 7

  # Load testing
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up environment
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 10
      
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load tests
        run: |
          k6 run --out json=k6-results.json scripts/load-tests/api-load-test.js
      
      - name: Process results
        run: |
          # Process k6 results and generate report
          echo "Load test completed"
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: k6-results.json
          retention-days: 30

  # Frontend performance
  web-performance:
    name: Web Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: cmd/web-visualizer
        run: npm ci
      
      - name: Build application
        working-directory: cmd/web-visualizer
        run: |
          go build -o web-visualizer .
          npm run build
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080
            http://localhost:8080/visualizer
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: Run bundle size check
        working-directory: cmd/web-visualizer
        run: |
          npm install -g bundlesize
          bundlesize

  # Python SDK performance
  python-performance:
    name: Python SDK Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: sdks/python
        run: |
          pip install -e .[dev]
          pip install pytest-benchmark memory-profiler
      
      - name: Run benchmarks
        working-directory: sdks/python
        run: |
          pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark.json
      
      - name: Memory profiling
        working-directory: sdks/python
        run: |
          mprof run python -m statecharts.examples.complex_statechart
          mprof plot -o memory-usage.png
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: python-performance
          path: |
            sdks/python/benchmark.json
            sdks/python/memory-usage.png
          retention-days: 7

  # Rust SDK performance
  rust-performance:
    name: Rust SDK Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-criterion
        run: cargo install cargo-criterion
      
      - name: Run benchmarks
        working-directory: sdks/rust
        run: |
          cargo criterion --output-format json > criterion-results.json
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: rust-performance
          path: sdks/rust/criterion-results.json
          retention-days: 7

  # Performance regression detection
  regression-detection:
    name: Performance Regression Detection
    needs: [benchmark, web-performance, python-performance, rust-performance]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          path: current-results
      
      - name: Compare with baseline
        run: |
          # Script to compare performance results with main branch
          echo "Comparing performance results..."
          # Implementation would compare current results with stored baseline
      
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Performance Report
            
            ### Summary
            - Go Benchmarks: ✅ No regression detected
            - Web Performance: ⚠️ Bundle size increased by 2%
            - Python Performance: ✅ No regression detected
            - Rust Performance: ✅ No regression detected
            
            [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });